name: daily

on:
  # arXiv's announcement email goes out Sun–Thu 20:00 ET, but the RSS and HTML
  # listings are regenerated at midnight ET.
  # Pre-compensate GitHub Actions queue delay
  schedule:
    - cron: "29 20 * * 0-4"
      timezone: "America/New_York"
  workflow_dispatch:

# Checks live in ci.yml. This workflow only delivers, so a push or pull request
# cannot accidentally send a card.
permissions:
  contents: read

concurrency:
  # A manual run and the cron must not deliver at the same time.
  group: paperfeed-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Ranking (300 calls) + one 12k-55k-token chat call per kept paper.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run paperfeed
        env:
          # Secrets.
          PAPERFEED_ZOTERO__USER_ID: ${{ secrets.ZOTERO_ID }}
          PAPERFEED_ZOTERO__API_KEY: ${{ secrets.ZOTERO_KEY }}
          PAPERFEED_BAILIAN__API_KEY: ${{ secrets.BAILIAN_KEY }}
          PAPERFEED_FEISHU__WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}

          # Optional settings: repository variable names match .env.example.
          # Unset means the default.
          PAPERFEED_ZOTERO__LIBRARY_TYPE: ${{ vars.PAPERFEED_ZOTERO__LIBRARY_TYPE }}
          PAPERFEED_ZOTERO__COLLECTION: ${{ vars.PAPERFEED_ZOTERO__COLLECTION }}
          PAPERFEED_ZOTERO__NOTE_TITLE: ${{ vars.PAPERFEED_ZOTERO__NOTE_TITLE }}
          PAPERFEED_ARXIV__CATEGORIES: ${{ vars.PAPERFEED_ARXIV__CATEGORIES }}
          PAPERFEED_ARXIV__ANNOUNCE_TYPES: ${{ vars.PAPERFEED_ARXIV__ANNOUNCE_TYPES }}
          PAPERFEED_ARXIV__MAX_CANDIDATES: ${{ vars.PAPERFEED_ARXIV__MAX_CANDIDATES }}
          PAPERFEED_FULL_TEXT__ENABLED: ${{ vars.PAPERFEED_FULL_TEXT__ENABLED }}
          PAPERFEED_FULL_TEXT__MAX_CHARS: ${{ vars.PAPERFEED_FULL_TEXT__MAX_CHARS }}
          PAPERFEED_FULL_TEXT__CONCURRENCY: ${{ vars.PAPERFEED_FULL_TEXT__CONCURRENCY }}
          PAPERFEED_BAILIAN__BASE_URL: ${{ vars.PAPERFEED_BAILIAN__BASE_URL }}
          PAPERFEED_BAILIAN__DECISION_MODEL: ${{ vars.PAPERFEED_BAILIAN__DECISION_MODEL }}
          PAPERFEED_BAILIAN__CHAT_MODEL: ${{ vars.PAPERFEED_BAILIAN__CHAT_MODEL }}
          PAPERFEED_BAILIAN__DECISION_CONCURRENCY: ${{ vars.PAPERFEED_BAILIAN__DECISION_CONCURRENCY }}
          PAPERFEED_BAILIAN__CHAT_CONCURRENCY: ${{ vars.PAPERFEED_BAILIAN__CHAT_CONCURRENCY }}
          PAPERFEED_BAILIAN__CHAT_EXTRA_BODY: ${{ vars.PAPERFEED_BAILIAN__CHAT_EXTRA_BODY }}
          PAPERFEED_FEISHU__CARD_COLOR: ${{ vars.PAPERFEED_FEISHU__CARD_COLOR }}
          PAPERFEED_MAX_PAPERS: ${{ vars.PAPERFEED_MAX_PAPERS }}
          PAPERFEED_MIN_SCORE: ${{ vars.PAPERFEED_MIN_SCORE }}
          PAPERFEED_AVOID_PENALTY: ${{ vars.PAPERFEED_AVOID_PENALTY }}
          PAPERFEED_LANGUAGE: ${{ vars.PAPERFEED_LANGUAGE }}
          PAPERFEED_DEBUG: ${{ vars.PAPERFEED_DEBUG }}
