[project]
name = "paperfeed"
dynamic = ["version"]
description = "Daily personalized arXiv feed, delivered as a Feishu card"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pyzotero>=1.6",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "feedparser>=6.0",
    "openai>=1.40",
    "tenacity>=8.3",
]

[project.scripts]
paperfeed = "paperfeed.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paperfeed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paperfeed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
